<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aunt13's HORRORscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Karla:ital,wght@0,300..800;1,300..800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Open all night &middot; No refunds &middot; No mercy</p>
    <h1 class="wordmark">AUNT13'S<span class="horror">HORROR<span class="scope">scope</span></span></h1>
    <p class="tagline">Your future looks chaotic, but at least the stars warned you.</p>
    <div class="rule"></div>
  </header>

  <div class="booth">
    <div class="field">
      <label for="bday">Enter your birthday</label>
      <input type="date" id="bday" value="1987-10-31" max="2026-12-31">
    </div>
    <button class="btn" id="readBtn" type="button">Read my stars</button>
  </div>

  <main class="reading" id="reading" aria-live="polite"></main>

  <p class="signoff">The universe has spoken. Don't @ me.</p>
</div>


<script src="script.js"></script>
</body>
</html>
